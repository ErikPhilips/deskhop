; First-light probe for the RT1062 port (SparkFun MicroMod Teensy on the ATP carrier).
; Not DeskHop firmware: an Arduino sketch that passes a mouse from the carrier's USB-A
; host socket through to the PC and reports the real report rates over USB serial.
[env:teensymm]
platform = teensy
board = teensymm
framework = arduino
build_flags = -D USB_SERIAL_HID
upload_protocol = teensy-cli
extra_scripts = pre:patch_mouse_interval.py
